<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOM-Trace Pro Mobile - Generatore Foglio Etichette Stampabili</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @media print {
            body {
                background: white !important;
                color: black !important;
            }
            .no-print {
                display: none !important;
            }
            .print-sheet {
                box-shadow: none !important;
                border: none !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
            }
            /* Quando si stampa una singola etichetta */
            body.print-single .label-card {
                display: none !important;
            }
            body.print-single .label-card.single-target {
                display: flex !important;
                position: absolute;
                left: 0;
                top: 0;
                margin: 0;
                border: none !important;
            }
            @page {
                size: A4;
                margin: 10mm;
            }
        }
    </style>
</head>
<body class="h-full bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 flex flex-col font-sans">

    <header class="no-print bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-40 shadow-xs">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="bg-indigo-600 text-white w-10 h-10 rounded-xl shadow-md flex items-center justify-center">
                    <i class="fa-solid fa-print text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base text-slate-900 dark:text-white">BOM-Trace Print Studio</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Generatore Fogli Etichette QR Scalabili</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="window.print()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-xs shadow-sm flex items-center gap-2 transition-all">
                    <i class="fa-solid fa-print"></i> Stampa Foglio
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 flex flex-col gap-6">
        
        <!-- Controls Toolbar -->
        <div class="no-print bg-white dark:bg-slate-900 p-4 sm:p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-2xs grid grid-cols-1 sm:grid-cols-4 gap-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Filtra per Contenitore</label>
                <select id="filter-container-select" onchange="renderSheet()" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-xs text-slate-900 dark:text-white">
                    <option value="">Tutti i Contenitori</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Dimensione Etichetta</label>
                <select id="label-size-select" onchange="updateLabelDimensions()" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-xs text-slate-900 dark:text-white">
                    <option value="compact">Piccola / Cassettiera Min (40x30 mm)</option>
                    <option value="standard" selected>Standard (60x40 mm)</option>
                    <option value="large">Grande / Scatola (80x50 mm)</option>
                    <option value="custom">Personalizzata</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Larghezza (mm)</label>
                <input type="number" id="custom-width" value="60" min="30" max="150" oninput="renderSheet()" class="w-full px-3.5 py-2 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-xs text-slate-900 dark:text-white">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Altezza (mm)</label>
                <input type="number" id="custom-height" value="40" min="20" max="100" oninput="renderSheet()" class="w-full px-3.5 py-2 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-xs text-slate-900 dark:text-white">
            </div>
        </div>

        <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-2xs flex flex-col gap-4 print-sheet">
            <div class="no-print flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3">
                <h3 class="font-bold text-sm text-slate-900 dark:text-white flex items-center gap-2">
                    <i class="fa-solid fa-table-cells text-indigo-600"></i> Anteprima Foglio Stampa A4
                </h3>
                <span id="label-count-badge" class="text-xs text-slate-500 font-semibold">0 etichette caricate</span>
            </div>

            <!-- Labels Grid Container -->
            <div id="labels-grid" class="flex flex-wrap gap-4 justify-start items-start">
                <!-- Dynamically populated -->
            </div>
        </div>

    </main>

    <script>
        let allItemsToPrint = [];

        window.onload = function() {
            loadItems();
            populateContainerFilter();
            checkUrlParams();
            renderSheet();
        };

        function loadItems() {
            const saved = localStorage.getItem('bom_trace_mobile_inventory');
            if (saved) {
                try {
                    const inventory = JSON.parse(saved);
                    const map = {};
                    inventory.forEach(item => {
                        const box = item.contenitore || "Box Principale";
                        const drawer = item.cassetto || "Cassetto 1";
                        const key = `${box}___${drawer}`;
                        map[key] = { box, drawer };
                    });
                    allItemsToPrint = Object.values(map);
                } catch(e) {
                    allItemsToPrint = [];
                }
            }

            if (allItemsToPrint.length === 0) {
                allItemsToPrint = [
                    { box: "Box Cassettiera A", drawer: "Cassetto 01" },
                    { box: "Box Cassettiera A", drawer: "Cassetto 02" },
                    { box: "Box Cassettiera B", drawer: "Cassetto 01" },
                    { box: "Valigetta Componenti", drawer: "Scomparto Centrale" }
                ];
            }
        }

        function populateContainerFilter() {
            const select = document.getElementById('filter-container-select');
            const boxes = [...new Set(allItemsToPrint.map(i => i.box))];
            
            boxes.forEach(box => {
                const opt = document.createElement('option');
                opt.value = box;
                opt.innerText = box;
                select.appendChild(opt);
            });
        }

        function checkUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const boxParam = params.get('box');
            const drawerParam = params.get('drawer');

            if (boxParam) {
                document.getElementById('filter-container-select').value = boxParam;
            }
        }

        function updateLabelDimensions() {
            const size = document.getElementById('label-size-select').value;
            const wInput = document.getElementById('custom-width');
            const hInput = document.getElementById('custom-height');

            if (size === 'compact') {
                wInput.value = 40;
                hInput.value = 30;
            } else if (size === 'standard') {
                wInput.value = 60;
                hInput.value = 40;
            } else if (size === 'large') {
                wInput.value = 80;
                hInput.value = 50;
            }
            renderSheet();
        }

        function renderSheet() {
            const grid = document.getElementById('labels-grid');
            grid.innerHTML = '';

            const selectedBox = document.getElementById('filter-container-select').value;
            const params = new URLSearchParams(window.location.search);
            const targetDrawer = params.get('drawer');

            let filtered = allItemsToPrint;
            if (selectedBox) {
                filtered = filtered.filter(i => i.box === selectedBox);
            }

            const widthMm = parseFloat(document.getElementById('custom-width').value) || 60;
            const heightMm = parseFloat(document.getElementById('custom-height').value) || 40;

            filtered.forEach((item, index) => {
                const labelCard = document.createElement('div');
                const widthPx = widthMm * 3.2;
                const heightPx = heightMm * 3.2;

                const isSingleTarget = targetDrawer && item.drawer === targetDrawer;

                labelCard.className = `label-card bg-white text-slate-900 border border-slate-300 rounded-lg p-2 flex flex-row items-center gap-2 shadow-2xs relative overflow-hidden ${isSingleTarget ? 'single-target' : ''}`;
                labelCard.style.width = `${widthPx}px`;
                labelCard.style.height = `${heightPx}px`;
                labelCard.style.boxSizing = 'border-box';

                const qrId = `qr-code-${index}`;
                
                labelCard.innerHTML = `
                    <div id="${qrId}" class="shrink-0 flex items-center justify-center"></div>
                    <div class="flex flex-col justify-center overflow-hidden flex-1">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-1 text-[9px] font-bold text-indigo-700 uppercase tracking-wider">
                                <i class="fa-solid fa-microchip"></i> BOM-Trace
                            </div>
                            <button onclick="printSingleLabel('${escapeHTML(item.box)}', '${escapeHTML(item.drawer)}')" class="no-print text-[9px] bg-slate-100 hover:bg-indigo-600 hover:text-white px-1.5 py-0.5 rounded text-slate-600 transition-colors" title="Stampa solo questa">
                                <i class="fa-solid fa-print"></i> Stampa Singola
                            </button>
                        </div>
                        <div class="font-bold text-[11px] text-slate-900 leading-tight truncate mt-0.5">${escapeHTML(item.box)}</div>
                        <div class="text-[10px] text-slate-600 font-semibold truncate">${escapeHTML(item.drawer)}</div>
                    </div>
                `;
                grid.appendChild(labelCard);

                setTimeout(() => {
                    const qrEl = document.getElementById(qrId);
                    if (qrEl) {
                        qrEl.innerHTML = '';
                        const qrSize = Math.min(heightPx - 16, 65);
                        const qrData = JSON.stringify({ contenitore: item.box, cassetto: item.drawer });
                        new QRCode(qrEl, {
                            text: qrData,
                            width: qrSize,
                            height: qrSize,
                            colorDark: "#0f172a",
                            colorLight: "#ffffff",
                            correctLevel: QRCode.CorrectLevel.M
                        });
                    }
                }, 50);
            });

            document.getElementById('label-count-badge').innerText = `${filtered.length} etichette visualizzate`;

            if (targetDrawer) {
                document.body.classList.add('print-single');
            }
        }

        function printSingleLabel(box, drawer) {
            const url = new URL(window.location.href);
            url.searchParams.set('box', box);
            url.searchParams.set('drawer', drawer);
            window.history.replaceState({}, '', url);
            document.body.classList.add('print-single');
            document.getElementById('filter-container-select').value = box;
            renderSheet();
            setTimeout(() => {
                window.print();
            }, 300);
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
